name: backend tests

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  offline:
    runs-on: ubuntu-latest
    # A throwaway Postgres, so the tests that need the store production runs on (migrations, advisory locks, the
    # account-creation race) run here instead of being skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tb
          POSTGRES_DB: truckbuddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: offline tests (no keys, no network)
        env:
          EXPO_PUBLIC_BACKEND_URL: ""
          TEST_DATABASE_URL: postgresql://postgres:tb@localhost:5432/truckbuddy_test
        # tests/offline plus the offline files directly in tests/ (OFFLINE_FILES in tests/conftest.py)
        run: python -m pytest -n 0 -m "not live" -q tests
      - name: flake8
        run: flake8 services server.py models.py tests/offline tests/test_*.py scripts
      - name: black (advisory)
        continue-on-error: true
        run: black --check --line-length 140 services server.py models.py tests/offline scripts || true
