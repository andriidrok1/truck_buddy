# Deploys backend/ to Railway (project truckbuddy, service backend) on every push to main that touches it.
# RAILWAY_TOKEN is a project token scoped to the production environment of that project.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx -y @railway/cli@5.71.0 up backend --path-as-root --service backend --ci

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://api.truckbuddy.io/api/health; then exit 0; fi
            sleep 5
          done
          echo "Backend did not become healthy" >&2
          exit 1
